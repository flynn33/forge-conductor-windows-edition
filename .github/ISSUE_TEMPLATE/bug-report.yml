name: Product defect
description: Report a reproducible Forge Conductor behavior that does not work.
title: "[Defect] "
labels: ["bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the app version, Windows version, and smallest reproduction. Do not include credentials.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Error or evidence
      description: Include a relevant error, action, or log excerpt without private tokens or signing keys.
  - type: dropdown
    id: scope
    attributes:
      label: Primary area
      options: [GUI, Installer, MCP or tools, Projects or memory, Provider or continuity, Build, Documentation]
